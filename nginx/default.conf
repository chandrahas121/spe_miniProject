server {
    listen 80;

    # Docker's built-in DNS. Re-resolving every few seconds means nginx keeps working
    # when the calculator containers are recreated with new IPs (e.g. after a redeploy).
    resolver 127.0.0.11 valid=5s;

    location / {
        # using a variable makes nginx resolve the name at request time,
        # and the service name returns the IPs of all replicas
        set $upstream http://calculator:8081;
        proxy_pass $upstream;

        # if a replica is gone, give up quickly and try the next one
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # shows which replica answered, handy for the demo
        add_header X-Upstream $upstream_addr always;
    }
}
