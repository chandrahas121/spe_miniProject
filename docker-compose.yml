# fixed project name, so a deploy from the Jenkins workspace updates this same stack
# instead of starting a second one next to it
name: calculator-devops

services:
  calculator:
    # Jenkins sets IMAGE_NAME (dockerhub-user/calculator) and IMAGE_TAG (build number).
    # Locally the defaults apply and `docker compose up` builds the image from the Dockerfile.
    image: ${IMAGE_NAME:-calculator}:${IMAGE_TAG:-latest}
    build: .
    environment:
      - PORT=8081
    expose:
      - "8081"
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - calculator-net

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - calculator-net

networks:
  calculator-net:
    driver: bridge
